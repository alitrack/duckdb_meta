[package]
name = "duckdb_meta"
version = "0.1.0"
edition = "2021"
description = "DuckDB extension: classical meta-analysis (metafor-compatible tau2 estimators)"
license = "MIT"
repository = "https://github.com/alitrack/duckdb_meta"

[lib]
name = "meta_ext"
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
strip = true

[dependencies]
quack-rs = "0.14"
libduckdb-sys = "1.10504"
libm = "0.2"
